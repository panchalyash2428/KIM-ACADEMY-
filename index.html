  };
  on(query(collection(db, "materials"), where("classId", "==", prof.classId)), s => { st.mat = s.docs.map(d => d.data()).sort((a, c) => ts(c) - ts(a)); mark("mat"); }, "mat");
  on(query(collection(db, "notices"), where("classId", "==", prof.classId)), s => { st.not = s.docs.map(d => d.data()).sort((a, c) => ts(c) - ts(a)); mark("not"); }, "not");
  on(query(collection(db, "timetable"), where("classId", "==", prof.classId)), s => { st.tt = {}; s.docs.forEach(d => { st.tt[d.data().day] = d.data().periods || []; }); mark("tt"); }, "tt");
  on(query(collection(db, "results"), where("uid", "==", me.uid)), s => { st.ts = s.docs.map(d => d.data()); mark("ts"); }, "ts");
  on(doc(db, "attendance", me.uid + "_" + mkey(now)), s => { st.days = s.exists() ? (s.data().days || {}) : {}; mark("att"); }, "att" + mkey(now));
}

function profView(b){
  const admin = prof.role === "admin";
  b.innerHTML = `<div style="text-align:center"><div class="av big">${esc(String(prof.name || "?")[0].toUpperCase())}</div><h1 style="margin:0">${esc(prof.name)}</h1><p class="mute">${admin ? "Administrator" : "Student"}</p></div>
  <div class="card"><div class="row" style="justify-content:space-between"><span class="mute">Class</span><b>${esc(prof.classId)}</b></div><div class="row" style="justify-content:space-between;margin-top:10px"><span class="mute">Email</span><b style="word-break:break-all;text-align:right">${esc(prof.email || me.email)}</b></div><div class="row" style="justify-content:space-between;margin-top:10px"><span class="mute">Status</span><span class="tg g">${admin ? "Admin" : "Approved"}</span></div></div>
  
  <div class="card" style="margin-top:16px">
    <h2 style="margin-top:0">About Juned Tuition Classes</h2>
    <p class="mute" style="font-size:14px;line-height:1.5"><b>The Golden Key to Knowledge</b></p>
    <p class="mute" style="font-size:13px;line-height:1.5">We don’t just educate students; we inspire minds, build character and shape futures.</p>
  </div>

  ${admin ? "" : `<h2>Help</h2>` + (contactHtml() || `<p class="mute">Contact details will be added soon.</p>`) + `<button class="btn ghost" data-a="notif">🔔 Turn on notifications</button>`}
  <button class="btn ghost" data-a="reload">↻ Reload the app (get the latest version)</button>
  <button class="btn ghost" data-a="reset">Send password reset email</button>
  <button class="btn" data-a="out" style="background:var(--bad)">Sign out</button>
  <p class="mute sm" style="text-align:center;margin-top:18px">This app stores your name, class, attendance and marks. Only you and your institute can see them.<br>${esc("JUNED TUITION CLASSES")}</p>`;
}
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat"];
const nowDay = new Date().getDay();
let ttDay = nowDay === 0 ? "Mon" : DAYS[nowDay - 1], aDay = ttDay;
const ft = t => { const h = +t.slice(0, 2); return ((h % 12) || 12) + ":" + t.slice(3) + (h < 12 ? " am" : " pm"); };
const pc = (m, x) => Math.round(100 * m / x);

function ttView(b){
  let data = {};
  const draw = () => {
    const L = data[ttDay] || [];
    b.innerHTML = `<h1>Timetable</h1><div class="chips">${DAYS.map(d => `<button class="${d === ttDay ? "on" : ""}" data-a="day" data-v="${d}">${d}</button>`).join("")}</div>` +
      (L.length ? L.map(p => `<div class="card row"><b style="width:74px">${ft(p.time)}</b><div><b>${esc(p.subject)}</b><span class="mute sm block">${esc(p.teacher)}</span></div></div>`).join("") : `<p class="mute">No classes on this day.</p>`);
  };
  acts.day = d => { ttDay = d.v; anim(b); draw(); };
  on(query(collection(db, "timetable"), where("classId", "==", prof.classId)), s => {
    data = {}; s.docs.forEach(d => { data[d.data().day] = d.data().periods || []; }); draw();
  }, "tt");
}

function testView(b){
  on(query(collection(db, "results"), where("uid", "==", me.uid)), s => {
    const T = s.docs.map(d => d.data()).sort((a, c) => String(a.date).localeCompare(String(c.date)));
    if (!T.length) { b.innerHTML = `<h1>Test analysis</h1><p class="mute">No results yet.</p>`; return; }
    const sub = {}; let tm = 0, tx = 0, ta = 0;
    T.forEach(t => {
      const avg = t.classAvg ?? 0; tm += t.marks; tx += t.max; ta += avg;
      const o = sub[t.subject] || (sub[t.subject] = {m: 0, x: 0, a: 0}); o.m += t.marks; o.x += t.max; o.a += avg;
    });
    const E = Object.entries(sub);
    const lo = E.reduce((a, c) => pc(c[1].m, c[1].x) < pc(a[1].m, a[1].x) ? c : a);
    const hi = E.reduce((a, c) => pc(c[1].m, c[1].x) > pc(a[1].m, a[1].x) ? c : a);
    const last = T[T.length - 1];
    const bars = E.map(([n, o]) => `<div style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><span>${esc(n)} ${E.length > 1 && n === lo[0] ? `<span class="tg w">Needs focus</span>` : E.length > 1 && n === hi[0] ? `<span class="tg g">Strongest</span>` : ""}</span><b>${pc(o.m, o.x)}%</b></div><div class="trk"><div class="fil" style="width:${pc(o.m, o.x)}%"></div><i class="mk" style="left:${pc(o.a, o.x)}%"></i></div></div>`).join("");
    const trend = T.slice(-6).map(t => `<i style="height:${pc(t.marks, t.max)}%"><em>${pc(t.marks, t.max)}</em></i>`).join("");
    const list = T.slice().reverse().map(t => `<div class="card row"><div class="grow"><b>${esc(t.testName)}, ${esc(t.subject)}</b><span class="mute sm block">${esc(t.date)}${t.rank ? ", rank " + t.rank + " of " + t.count : ""}</span></div><div style="text-align:right"><b>${t.marks}/${t.max}</b><br><span class="tg ${t.marks >= (t.classAvg ?? 0) ? "g" : "w"}">${t.marks >= (t.classAvg ?? 0) ? "Above avg" : "Below avg"}</span></div></div>`).join("");
    b.innerHTML = `<h1>Test analysis</h1>
    <div class="card"><div class="big">${pc(tm, tx)}%</div><p class="mute">Your average over ${T.length} tests. Class average is ${pc(ta, tx)}%.${last.rank ? " Latest rank: " + last.rank + " of " + last.count + "." : ""}</p></div>
    <div class="card"><h2 style="margin-top:0">By subject</h2><p class="mute sm">The yellow line is the class average.</p>${bars}</div>
    <div class="card"><h2 style="margin-top:0">Recent trend</h2><div class="tr">${trend}</div></div>
    <h2>All tests</h2>${list}`;
  }, "ts");
}

function aTT(b){
  let periods = [];
  const ref = () => doc(db, "timetable", aCls + "__" + aDay);
  b.innerHTML = `<h1>Timetable</h1>
  <label for="tc">Class</label><select id="tc">${opts(CLASSES, aCls)}</select>
  <label for="td">Day</label><select id="td">${opts(DAYS, aDay)}</select>
  <div id="tl" style="margin-top:12px"></div>
  <h2>Add a period</h2>
  <label for="tm">Start time</label><input id="tm" type="time" value="09:00">
  <label for="ts">Subject</label><select id="ts">${opts(SUBJECTS)}</select>
  <label for="tn">Teacher</label><input id="tn">
  ${NOTI}<button class="btn" data-a="addp">Add to timetable</button>`;
  $("#tc").onchange = e => { aCls = e.target.value; render(); };
  $("#td").onchange = e => { aDay = e.target.value; render(); };
  const save = list => setDoc(ref(), {classId: aCls, day: aDay, periods: [...list].sort((a, c) => a.time.localeCompare(c.time))});
  acts.addp = () => {
    const tn = $("#tn").value.trim(), tm = $("#tm").value;
    if (!tm || !tn) return toast("Add a start time and a teacher name");
    save([...periods, {time: tm, subject: $("#ts").value, teacher: tn}]).then(() => { notify(aCls, "Timetable updated", aDay + ": " + $("#ts").value + " at " + ft($("#tm").value)); $("#tn").value = ""; toast("Added"); }).catch(fail);
  };
  acts.delp = d => save(periods.filter((_, i) => i !== Number(d.v))).then(() => notify(aCls, "Timetable updated", aDay + ": a class was removed")).catch(fail);
  on(ref(), s => {
    periods = s.exists() ? (s.data().periods || []) : [];
    $("#tl").innerHTML = periods.length ? periods.map((p, i) => `<div class="card row"><b style="width:74px">${ft(p.time)}</b><div class="grow"><b>${esc(p.subject)}</b><span class="mute sm block">${esc(p.teacher)}</span></div><button class="chip" data-a="delp" data-v="${i}">Delete</button></div>`).join("") : `<p class="mute">No periods yet for ${esc(aDay)}.</p>`;
  });
}

function aRes(b){
  let stu = [];
  b.innerHTML = `<h1>Enter test marks</h1>
  <label for="rc">Class</label><select id="rc">${opts(CLASSES, aCls)}</select>
  <label for="rs">Subject</label><select id="rs">${opts(SUBJECTS)}</select>
  <label for="rn">Test name</label><input id="rn" placeholder="Example: Unit test 1">
  <label for="rx">Maximum marks</label><input id="rx" type="number" value="50">
  <label for="rd">Date</label><input id="rd" type="date" value="${todayStr()}">
  <h2>Marks (leave blank if absent)</h2><div id="rl"></div>`;
  $("#rc").onchange = e => { aCls = e.target.value; render(); };
  acts.saveres = async () => {
    const tn = $("#rn").value.trim(), mx = Number($("#rx").value), sj = $("#rs").value;
    if (!tn || !(mx > 0)) return toast("Enter a test name and maximum marks");
    const rows = stu.map(u => ({u, v: $("#m-" + u.id).value})).filter(r => r.v !== "").map(r => ({u: r.u, m: Number(r.v)}));
    if (!rows.length) return toast("Enter marks for at least one student");
    if (rows.some(r => !(r.m >= 0 && r.m <= mx))) return toast("Marks must be between 0 and " + mx);
    const avg = Math.round(rows.reduce((a, r) => a + r.m, 0) / rows.length * 10) / 10;
    try {
      const batch = writeBatch(db);
      rows.forEach(r => {
        const id = (tn + "__" + sj + "__" + r.u.id).replace(/\//g, "-");
        batch.set(doc(db, "results", id), {uid: r.u.id, classId: aCls, subject: sj, testName: tn, date: $("#rd").value, max: mx, marks: r.m, classAvg: avg, rank: 1 + rows.filter(o => o.m > r.m).length, count: rows.length, createdAt: serverTimestamp()});
      });
      await batch.commit(); toast("Results saved"); notify(aCls, "New test results", tn + " (" + sj + ") results are out"); $("#rn").value = ""; stu.forEach(u => { $("#m-" + u.id).value = ""; });
    } catch (e) { fail(e); }
  };
  on(approvedQ(), s => {
    stu = names(s);
    $("#rl").innerHTML = stu.length ? stu.map(u => `<div class="card row"><div class="grow"><b>${esc(u.name)}</b></div><input class="num" id="m-${u.id}" type="number" inputmode="decimal" min="0"></div>`).join("") + `${NOTI}<button class="btn" data-a="saveres">Save results</button>` : `<p class="mute">No approved students in this class.</p>`;
  });
}

function adminView(){
  root.innerHTML = shell("JUNED TUITION CLASSES", "Admin: " + prof.name, [["a-stu","👥<br>Students"],["a-mat","📁<br>Material"],["a-not","📢<br>Notice"],["a-att","✅<br>Attend."],["a-tt","🗓<br>Timing"],["a-res","📝<br>Marks"]]);
  ({"a-stu": aStu, "a-mat": aMat, "a-not": aNot, "a-att": aAtt, "a-tt": aTT, "a-res": aRes, "prof": profView}[tab])($("#body"));
}
const approvedQ = () => query(collection(db, "users"), where("classId", "==", aCls), where("status", "==", "approved"));
const names = s => s.docs.filter(d => d.data().role !== "admin").map(d => ({id: d.id, ...d.data()})).sort((a, c) => String(a.name).localeCompare(String(c.name)));

function aStu(b){
  b.innerHTML = `<h1>Students</h1><h2>Waiting for approval</h2><div id="pend"></div><h2>Approved students</h2><select id="fc" aria-label="Class">${opts(CLASSES, aCls)}</select><div id="appr" style="margin-top:10px"></div>`;
  $("#fc").onchange = e => { aCls = e.target.value; render(); };
  on(query(collection(db, "users"), where("status", "==", "pending")), s => {
    $("#pend").innerHTML = s.docs.length ? s.docs.map(d => { const u = d.data(); return `<div class="card row"><div class="grow"><b>${esc(u.name)}</b><span class="mute sm block">${esc(u.classId)}, ${esc(u.email)}</span></div><button class="chip" data-a="rej" data-v="${d.id}">Reject</button><button class="chip ok" data-a="apr" data-v="${d.id}">Approve</button></div>`; }).join("") : `<p class="mute">No new requests.</p>`;
  });
  on(approvedQ(), s => {
    const L = names(s);
    $("#appr").innerHTML = L.length ? L.map(u => `<div class="card row"><div class="grow"><b>${esc(u.name)}</b><span class="mute sm block">${esc(u.email)}</span></div><select class="mv" data-id="${u.id}" aria-label="Move to class" style="width:auto;padding:8px">${opts(CLASSES, aCls)}</select><button class="chip" data-a="rem" data-v="${u.id}">Remove</button></div>`).join("") : `<p class="mute">No approved students in this class.</p>`;
  });
}

function aMat(b){
  b.innerHTML = `<h1>Add material</h1>
  <label for="mc">Class</label><select id="mc">${opts(CLASSES, aCls)}</select>
  <label for="ms">Subject</label><select id="ms">${opts(SUBJECTS)}</select>
  <label for="mt">Title</label><input id="mt">
  <label for="ml">Google Drive or YouTube link</label><input id="ml" type="url" placeholder="https://">
  <label for="mk">Type</label><select id="mk"><option value="pdf">PDF or notes</option><option value="video">Video</option></select>
  ${NOTI}<button class="btn" data-a="addm">Publish material</button>
  <h2>Already published for this class</h2><div id="ml-list"></div>`;
  $("#mc").onchange = e => { aCls = e.target.value; render(); };
  on(query(collection(db, "materials"), where("classId", "==", aCls)), s => {
    const L = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a, c) => ts(c) - ts(a));
    $("#ml-list").innerHTML = L.length ? L.map(i => `<div class="card row"><div class="grow"><b>${esc(i.title)}</b><span class="mute sm block">${esc(i.subject)}</span></div><button class="chip" data-a="delm" data-v="${i.id}">Delete</button></div>`).join("") : `<p class="mute">Nothing yet.</p>`;
  });
}

function aNot(b){
  b.innerHTML = `<h1>Post notice</h1>
  <label for="nc">Class</label><select id="nc">${opts(CLASSES, aCls)}</select>
  <label for="nt">Title</label><input id="nt">
  <label for="nb">Message</label><textarea id="nb" rows="4"></textarea>
  ${NOTI}<button class="btn" data-a="addn">Send notice to class</button>
  <h2>Already posted for this class</h2><div id="nl"></div>`;
  $("#nc").onchange = e => { aCls = e.target.value; render(); };
  on(query(collection(db, "notices"), where("classId", "==", aCls)), s => {
    const L = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a, c) => ts(c) - ts(a));
    $("#nl").innerHTML = L.length ? L.map(n => `<div class="card row"><div class="grow"><b>${esc(n.title)}</b><span class="mute sm block">${fmt(n.createdAt)}</span></div><button class="chip" data-a="deln" data-v="${n.id}">Delete</button></div>`).join("") : `<p class="mute">Nothing yet.</p>`;
  });
}

function aAtt(b){
  b.innerHTML = `<h1>Mark attendance</h1>
  <label for="ac">Class</label><select id="ac">${opts(CLASSES, aCls)}</select>
  <label for="ad">Date</label><input id="ad" type="date" value="${aDate}" max="${todayStr()}">
  <div id="al" style="margin-top:14px"></div>`;
  $("#ac").onchange = e => { aCls = e.target.value; marks = {}; render(); };
  $("#ad").onchange = e => { aDate = e.target.value || todayStr(); marks = {}; render(); };
  const mk = aDate.slice(0, 7), day = Number(aDate.slice(8));
  let stu = [], saved = {};
  const status = id => marks[id] || saved[id] || "P";
  const draw = () => {
    $("#al").innerHTML = stu.length ? stu.map(u => `<div class="card row"><div class="grow"><b>${esc(u.name)}</b></div><div class="seg"><button class="${status(u.id) === "P" ? "on p" : ""}" data-a="mk" data-v="${u.id}|P">P</button><button class="${status(u.id) === "A" ? "on a" : ""}" data-a="mk" data-v="${u.id}|A">A</button></div></div>`).join("") + `<button class="btn" data-a="saveatt">Save attendance</button>` : `<p class="mute">No approved students in this class.</p>`;
  };
  acts.mk = d => { const [i, v] = d.v.split("|"); marks[i] = v; draw(); };
  acts.saveatt = async () => {
    try {
      const batch = writeBatch(db);
      stu.forEach(u => batch.set(doc(db, "attendance", u.id + "_" + mk), {uid: u.id, classId: aCls, month: mk, days: {[day]: status(u.id)}}, {merge: true}));
      await batch.commit(); toast("Attendance saved");
    } catch (e) { fail(e); }
  };
  on(approvedQ(), s => { stu = names(s); draw(); });
  on(query(collection(db, "attendance"), where("classId", "==", aCls), where("month", "==", mk)), s => {
    saved = {}; s.docs.forEach(d => { saved[d.data().uid] = (d.data().days || {})[day]; }); draw();
  });
}
</script>
